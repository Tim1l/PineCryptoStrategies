<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="title desc">
  <title id="title">Pine Script development services</title>
  <desc id="desc">Four areas of custom development: custom indicators, multi-timeframe tools, trading rules translated into Pine Script, and code review and refinement.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07171d"/>
      <stop offset="1" stop-color="#102e33"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#122d34"/>
      <stop offset="1" stop-color="#0d232b"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#69b8b4" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="680" rx="20" fill="url(#background)"/>
  <rect x="20" y="20" width="1240" height="640" rx="12" fill="url(#grid)"/>

  <g font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">
    <text x="56" y="39" font-size="13" font-weight="700" letter-spacing="2" fill="#78d7cf">TRADINGVIEW TOOLS</text>
    <rect x="56" y="54" width="5" height="34" rx="2.5" fill="#7adfd2"/>
    <text x="78" y="82" font-size="32" font-weight="700" fill="#edf8f7">Pine Script Development</text>
    <text x="56" y="119" font-size="17" fill="#abc4c9">Your trading rules, translated into practical chart tools.</text>

    <g transform="translate(1048 47)">
      <rect width="176" height="43" rx="10" fill="#14363d" stroke="#31565d"/>
      <g fill="none" stroke="#82e4d7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="m22 15-6 6 6 6m15-12 6 6-6 6m-6-15-5 18"/>
      </g>
      <text x="56" y="27" font-size="14" font-weight="700" fill="#d9eeee">PINE SCRIPT</text>
    </g>

    <g transform="translate(56 154)">
      <rect width="568" height="194" rx="15" fill="url(#card)" stroke="#31535b"/>
      <text x="26" y="35" font-size="13" font-weight="700" letter-spacing="1.5" fill="#72c7c0">01 / INDICATORS</text>
      <rect x="494" y="21" width="48" height="48" rx="12" fill="#193e45"/>
      <g transform="translate(503 30)" fill="none" stroke="#8ce7da" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 4v23h24M6 17c3-10 6-10 9-2s6 8 11-6"/>
        <circle cx="15" cy="15" r="2.5" fill="#193e45"/>
      </g>
      <text x="26" y="86" font-size="26" font-weight="700" fill="#edf8f7">Custom Indicators</text>
      <text x="26" y="125" font-size="18" fill="#b4cdd2">Chart overlays and visual tools</text>
      <text x="26" y="153" font-size="18" fill="#b4cdd2">Inputs tailored to your workflow</text>
    </g>

    <g transform="translate(656 154)">
      <rect width="568" height="194" rx="15" fill="url(#card)" stroke="#31535b"/>
      <text x="26" y="35" font-size="13" font-weight="700" letter-spacing="1.5" fill="#72c7c0">02 / MARKET CONTEXT</text>
      <rect x="494" y="21" width="48" height="48" rx="12" fill="#193e45"/>
      <g transform="translate(503 30)" fill="none" stroke="#8ce7da" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 5h20v20H5zM1 10H-1v19h20v-2M15 2v6m0 14v6"/>
        <rect x="11" y="11" width="8" height="8" rx="1"/>
      </g>
      <text x="26" y="86" font-size="26" font-weight="700" fill="#edf8f7">Multi-Timeframe Tools</text>
      <text x="26" y="125" font-size="18" fill="#b4cdd2">Higher-timeframe context</text>
      <text x="26" y="153" font-size="18" fill="#b4cdd2">Candles, bands and overlays</text>
    </g>

    <g transform="translate(56 374)">
      <rect width="568" height="194" rx="15" fill="url(#card)" stroke="#31535b"/>
      <text x="26" y="35" font-size="13" font-weight="700" letter-spacing="1.5" fill="#72c7c0">03 / YOUR RULES</text>
      <rect x="494" y="21" width="48" height="48" rx="12" fill="#193e45"/>
      <g transform="translate(503 30)" fill="none" stroke="#8ce7da" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="m9 7-7 8 7 8m12-16 7 8-7 8m-4-19-4 22"/>
      </g>
      <text x="26" y="86" font-size="26" font-weight="700" fill="#edf8f7">Trading Rules to Pine Script</text>
      <text x="26" y="125" font-size="18" fill="#b4cdd2">Translate your rules into code</text>
      <text x="26" y="153" font-size="18" fill="#b4cdd2">Readable strategy prototypes</text>
    </g>

    <g transform="translate(656 374)">
      <rect width="568" height="194" rx="15" fill="url(#card)" stroke="#31535b"/>
      <text x="26" y="35" font-size="13" font-weight="700" letter-spacing="1.5" fill="#72c7c0">04 / EXISTING CODE</text>
      <rect x="494" y="21" width="48" height="48" rx="12" fill="#193e45"/>
      <g transform="translate(503 30)" fill="none" stroke="#8ce7da" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="13" cy="13" r="9"/>
        <path d="m20 20 8 8m-20-15 4 4 6-8"/>
      </g>
      <text x="26" y="86" font-size="26" font-weight="700" fill="#edf8f7">Code Review &amp; Refinement</text>
      <text x="26" y="125" font-size="18" fill="#b4cdd2">Review and explain existing logic</text>
      <text x="26" y="153" font-size="18" fill="#b4cdd2">Refactor for clarity and maintenance</text>
    </g>

    <path d="M56 608H1224" stroke="#31535b"/>
    <text x="56" y="643" font-size="16" fill="#a7c5cb">Custom development around your trading workflow</text>
    <g transform="translate(1174 627)" fill="#7adfd2">
      <circle cx="4" cy="10" r="3" fill-opacity=".4"/>
      <circle cx="24" cy="10" r="3" fill-opacity=".7"/>
      <circle cx="44" cy="10" r="3"/>
    </g>
